# fly.toml app configuration file generated for Sentiment Omikuji

app = "sentiment-omikuji"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  HTTP_PORT = "8080"
  RAILS_ENV = "production"
  RAILS_LOG_TO_STDOUT = "true"
  RAILS_SERVE_STATIC_FILES = "true"
  WEB_CONCURRENCY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  
  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "300s"
    interval = "30s"
    port = 8080
    type = "tcp"
    timeout = "15s"

[[mounts]]
  source = "omikuji_data"
  destination = "/rails/storage"

[vm]
  size = "shared-cpu-2x"
  memory_mb = 2048

