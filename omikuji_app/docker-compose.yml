services:
  app:
    build: .
    command: ./bin/thrust ./bin/rails server
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - storage_data:/rails/storage
    environment:
      - RAILS_ENV=production
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_SERVE_STATIC_FILES=true
      - HTTP_PORT=8080

  worker:
    build: .
    command: ./bin/jobs
    restart: on-failure
    depends_on:
      - app
    volumes:
      - storage_data:/rails/storage
    environment:
      - RAILS_ENV=production
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - RAILS_LOG_TO_STDOUT=true
      - SKIP_DB_PREPARE=true

volumes:
  storage_data:
